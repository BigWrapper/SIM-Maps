name: Android GOLD No Keys
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build GOLD Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace
      - name: Upload GOLD APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-GOLD-Upington
          path: |
            android/build/outputs/apk/fdroid/debug/*.apk
            android/app/build/outputs/apk/fdroid/debug/*.apk
